<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>ストップウォッチ</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <h3>ストップウォッチ</h3>
     <div class="time" id="display">0 : 0 : 0 : 0</div>
     <button type="button" id="startBtn">スタート</button>
     <button type="button" id="stopBtn" disabled>ストップ</button>
     <button type="button" id="resetBtn" disabled>リセット</button>
    <script src="main.js"></script>
  </body>
</html>
